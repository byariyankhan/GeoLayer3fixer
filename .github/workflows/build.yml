name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GeoLayer_Fixer
          --collect-data customtkinter
          --hidden-import watchdog.observers.read_directory_changes
          run.py

      - name: Smoke test (CLI scan of empty folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $p = Start-Process dist\GeoLayer_Fixer.exe -ArgumentList "--scan","smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLayer_Fixer
          path: dist/GeoLayer_Fixer.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeoLayer_Fixer.exe
