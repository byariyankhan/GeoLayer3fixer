name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GeoLayer_Fixer
          --collect-data customtkinter
          --hidden-import watchdog.observers.read_directory_changes
          run.py

      - name: Smoke test (CLI scan of empty folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $p = Start-Process dist\GeoLayer_Fixer.exe -ArgumentList "--scan","smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLayer_Fixer
          path: dist/GeoLayer_Fixer.exe

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import geolayer_fixer; print(geolayer_fixer.__version__)')" >> "$GITHUB_OUTPUT"

      # Every push to main publishes/updates the release for the current version
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: GeoLayer Fixer v${{ steps.ver.outputs.v }}
          body: |
            Download **GeoLayer_Fixer.exe** below.
            Close the old v1 fixer first. Then: keep Auto Watcher on, click Fix Tiles Now before render,
            and in AE use Edit > Purge > All Memory & Disk Cache.
          files: dist/GeoLayer_Fixer.exe
