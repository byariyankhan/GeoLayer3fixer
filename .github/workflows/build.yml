name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Test GL-PATCH v4 installer (fake GEOlayers extension)
        shell: pwsh
        run: ./gl-patch/ci_test_installer.ps1

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name GeoLayer_Fixer
          --collect-data customtkinter
          --hidden-import watchdog.observers.read_directory_changes
          run.py

      - name: Smoke test exe (30 real tiles, multi-process path)
        shell: pwsh
        run: |
          python tests/smoke_exe.py make smoke
          $p = Start-Process dist\GeoLayer_Fixer.exe -ArgumentList "--fix","smoke" -Wait -PassThru
          Write-Host "exe exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          python tests/smoke_exe.py check smoke
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package GL-PATCH v4
        shell: pwsh
        run: Compress-Archive -Path gl-patch/glsafe_v4.js, gl-patch/Install-GlPatchV4.ps1, gl-patch/Uninstall-GlPatchV4.ps1, gl-patch/install.cmd -DestinationPath dist/GL-PATCH-v4.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GeoLayer_Fixer
          path: |
            dist/GeoLayer_Fixer.exe
            dist/GL-PATCH-v4.zip

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import geolayer_fixer; print(geolayer_fixer.__version__)')" >> "$GITHUB_OUTPUT"

      # Keep the version tag on the commit that produced this exe
      - name: Move tag to this commit
        shell: bash
        run: |
          git tag -f "v${{ steps.ver.outputs.v }}"
          git push -f origin "v${{ steps.ver.outputs.v }}"

      # Every push to main publishes/updates the release for the current version
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: GeoLayer Fixer v${{ steps.ver.outputs.v }}
          body: |
            **GeoLayer_Fixer.exe** - watches the GEOlayers tile cache and repairs/quarantines broken tiles.
            **GL-PATCH-v4.zip** - GL-PATCH v4.1 for GEOlayers 3: broken PNGs from canvas.toDataURL are
            re-encoded before they are written (needs GL-PATCH v3 or v4.0; close After Effects, unzip,
            double-click install.cmd).
            See gl-patch/README.md.
          files: |
            dist/GeoLayer_Fixer.exe
            dist/GL-PATCH-v4.zip
